version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./financial-ai-client
      dockerfile: DockerFile
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend

  backend:
    build:
      context: ./financial-ai-backend
      dockerfile: DockerFile
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${MYSQL_DATABASE}
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_FILE_PATH_FILES=/app/uploads   # ← 加這行
      - SPRING_FILE_PATH_AUDIOS=/app/audios   # ← 加這行
      - SPRING_JPA_HIBERNATE_NAMING_PHYSICAL_STRATEGY=org.financial.financialaibackend.config.Jpa.JpaConfig  # ← 這行還沒加
      - SPRING_CLOUD_AWS_REGION_STATIC=us-east-1
      - SPRING_CLOUD_AWS_S3_BUCKET=finaid-bucket
      - AI_SERVICE_URL=http://ai:7000/api/ai    # ← 新增這行
      - SPRING_DATA_REDIS_HOST=redis          # ← 新增
      - SPRING_DATA_REDIS_PORT=6379           # ← 新增
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}   # ← 新增
    volumes:
      - ./files:/app/files
      - ./audios:/app/audios
    depends_on:
      db:
        condition: service_healthy
  ai:
    build:
      context: ./financial-ai-service
      dockerfile: Dockerfile
    expose:
      - "7000"
    environment:
      - OPEN_AI_KEY=${OPEN_AI_KEY}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=financial_springboot
    depends_on:
      db:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    command: --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdennis0215"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysqldata:/var/lib/mysql
      - ./financial_springboot.sql:/docker-entrypoint-initdb.d/financial_springboot.sql

volumes:
  mysqldata:
  redis-data: